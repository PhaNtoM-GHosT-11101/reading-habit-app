name: Update books index

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Regenerate books.json + covers
        run: python3 scripts/generate_books_index.py

      - name: Commit changes if any
        run: |
          if ! git diff --quiet -- books.json covers; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add books.json covers
            git commit -m "chore: regenerate books index and covers"
            git push
          else
            echo "No changes to commit"
          fi